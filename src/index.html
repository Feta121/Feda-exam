<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anesthesia Mock Exam</title>
    <meta name="description" content="Question bank and timed mock examinations for anesthesia students." />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Light is the default whatever the device theme is. Dark is used only after the student switches to it.
      try { if (localStorage.getItem('ame:theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <style>
      #boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; background: #f8fafc; color: #64748b; font: 14px system-ui, sans-serif; }
      html.dark #boot-splash { background: #07111f; color: #94a3b8; }
      #boot-splash .bs-card { width: 100%; max-width: 320px; overflow: hidden; border-radius: 16px; background: #f4f8f9; box-shadow: 0 0 0 1px rgba(148,163,184,.35); }
      #boot-splash img { display: block; width: 100%; height: auto; }
      #boot-splash .bs-bar { width: 160px; height: 6px; overflow: hidden; border-radius: 9999px; background: rgba(148,163,184,.35); }
      #boot-splash .bs-bar span { display: block; width: 33%; height: 100%; border-radius: 9999px; background: #1b8f86; animation: bs-slide 1.2s ease-in-out infinite; }
      @keyframes bs-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bs-bar span { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading">
        <div class="bs-card"><img src="brand.png" alt="Anesthesia Mock Exam by Abdulfetah" width="720" height="264" /></div>
        <div class="bs-bar"><span></span></div>
        <p>Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
